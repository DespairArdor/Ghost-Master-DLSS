[DLSS]
; replace = DLSS on at start, off = game's own TAAU. F6 toggles in game, F7 shows/hides the status line.
Mode=replace
ShowStatus=0
; DLSS model preset: default, J, K (transformer, best quality), L (ultra performance), M (performance).
Preset=default
; addon = render resolution from ScreenPercentage below, applied from launch; game = the game's Resolution Quality slider.
ScaleSource=addon
; Quality 66.7, Balanced 58, Performance 50, Ultra Performance 33.3 (allowed 33.3 - 99).
ScreenPercentage=66.7
; 1 = DLSS Frame Generation (RTX 40/50). 0 = do not load Streamline at all.
FrameGeneration=1
; 1 = large research logs and slower; leave at 0.
Diagnostics=0
; Empty = defaults: .\streamline for the NVIDIA runtime, .\ghostmaster-dlss for logs. Relative paths are relative to this folder.
RuntimeDir=
StreamlineDir=
LogDir=
